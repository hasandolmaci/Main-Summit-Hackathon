<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunbeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="liquid-glass.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font: 15px/1.5 var(--lg-f-ui); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: max(20px, env(safe-area-inset-top, 0px)) 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 22px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 18px/1 var(--lg-f-display); letter-spacing: -.01em; }
  .brand svg { width: 26px; height: 26px; }

  .run { display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: end; }
  .run h1 { font: 600 clamp(24px, 3.6vw, 34px)/1.1 var(--lg-f-display); letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
  .run p { margin: 0; color: var(--lg-ink-2); max-width: 60ch; }
  .run .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 22px; font: 500 12.5px/1.3 var(--lg-f-mono); color: var(--lg-ink-2); }
  .stats b { color: var(--lg-ink); font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { .run { grid-template-columns: 1fr; } }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .filters .lg-input { flex: 1 1 240px; max-width: 360px; }

  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 14px; }
  .empty { padding: 28px; text-align: center; color: var(--lg-ink-2); }
  .note { font-size: 12.5px; color: var(--lg-ink-3); margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body class="lg-ambient">
<main class="wrap">

  <header class="topbar lg-glass lg-panel lg-panel--bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#ff8f5a"/></linearGradient></defs><circle cx="16" cy="16" r="7" fill="url(#sb)"/><g stroke="url(#sb)" stroke-width="2.2" stroke-linecap="round"><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.8 6.8l2.1 2.1M23.1 23.1l2.1 2.1M6.8 25.2l2.1-2.1M23.1 8.9l2.1-2.1"/></g></svg>
      Sunbeam
    </div>
    <div class="lg-seg lg-glass" role="group" aria-label="Theme" id="theme">
      <button type="button" data-value="auto" aria-pressed="true">Auto</button>
      <button type="button" data-value="light" aria-pressed="false">Light</button>
      <button type="button" data-value="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <section class="run lg-glass lg-panel" aria-labelledby="run-title">
    <div>
      <h1 id="run-title">This week's shortlist</h1>
      <p>DACH deep-tech and technical startups most likely to raise a first round within 24 months, from public patents, grants, trademarks and GitHub activity.</p>
    </div>
    <div class="actions">
      <button class="lg-btn lg-btn--primary" type="button" id="run-btn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="3"/><path d="M8 8l4.2-4.2" stroke-linecap="round"/></svg>
        <span>Run radar</span>
      </button>
      <button class="lg-btn lg-btn--secondary" type="button" id="backtest-btn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.3 2.3v3h3"/></svg>
        <span>Replay backtest</span>
      </button>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </section>

  <div class="filters">
    <label class="sr" for="q">Search companies</label>
    <input class="lg-input" id="q" type="search" placeholder="Search company, city or signal">
    <div class="lg-seg lg-glass" role="group" aria-label="Sector" id="sector">
      <button type="button" data-value="all" aria-pressed="true">All</button>
      <button type="button" data-value="deeptech" aria-pressed="false">Deep-tech</button>
      <button type="button" data-value="software" aria-pressed="false">Technical software</button>
    </div>
  </div>

  <section class="list" id="list" aria-label="Shortlist"></section>
  <p class="note">Sample data: the companies on this page are made up. Replace <code>shortlist.sample.js</code> with the radar run output.</p>
</main>

<script src="shortlist.sample.js"></script>
<script src="liquid-glass.js"></script>
<script>
(function () {
  var data = window.SUNBEAM_SAMPLE, state = { q: '', sector: 'all' };
  var list = document.getElementById('list'), stats = document.getElementById('stats');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function row(r, i) {
    return '<article class="lg-card lg-glass" tabindex="0">' +
      '<div class="lg-row-head"><span class="lg-rank">#' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div class="lg-name"><h3>' + esc(r.name) + '</h3><small>' + esc(r.place) + ' · ' + esc(r.what) + '</small></div>' +
      '<div class="lg-score"><b>' + r.score.toFixed(2) + '</b><em>P(round ≤ 24 mo)</em></div></div>' +
      '<div class="lg-meter" role="img" aria-label="Score ' + r.score.toFixed(2) + '"><i style="--s:' + r.score + '"></i></div>' +
      '<ul class="lg-chips">' + r.reasons.map(function (x) { return '<li class="lg-chip"><b>' + esc(x[0]) + '</b>' + esc(x[1]) + '</li>'; }).join('') + '</ul>' +
      '<p class="lg-twin">Most similar past winner: <b>' + esc(r.twin) + '</b>, 90 days before its round</p></article>';
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    var rows = data.rows.filter(function (r) {
      if (state.sector !== 'all' && r.sector !== state.sector) return false;
      if (!q) return true;
      return [r.name, r.place, r.what].concat(r.reasons.map(function (x) { return x[1]; })).join(' ').toLowerCase().indexOf(q) > -1;
    });
    list.innerHTML = rows.length ? rows.map(row).join('') : '<div class="lg-glass lg-panel empty">No companies match this search.</div>';
    var d = new Date(data.run.date + 'T00:00:00');
    stats.innerHTML = '<span>Last run <b>' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + '</b></span>' +
      '<span>Scanned <b>' + data.run.scanned.toLocaleString('en-US') + '</b></span>' +
      '<span>Shortlisted <b>' + data.run.shortlisted + '</b></span>' +
      '<span>Showing <b>' + rows.length + '</b></span>';
  }

  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.getElementById('sector').addEventListener('lg-change', function (e) { state.sector = e.detail.value; render(); });
  document.getElementById('theme').addEventListener('lg-change', function (e) {
    var v = e.detail.value;
    if (v === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
  });

  // Demo only: show the busy state, then refresh the run date.
  var run = document.getElementById('run-btn');
  run.addEventListener('click', function () {
    if (run.getAttribute('aria-busy') === 'true') return;
    run.setAttribute('aria-busy', 'true'); run.querySelector('span').textContent = 'Running…';
    setTimeout(function () {
      run.removeAttribute('aria-busy'); run.querySelector('span').textContent = 'Run radar';
      data.run.date = new Date().toISOString().slice(0, 10); render();
    }, 1600);
  });

  render();
})();
</script>
</body>
</html>
